@if(selectedItems().length !== 0) {
    <div class="cart">
        @for (item of selectedItems(); track $index) {
        <div class="cart-items">
            <span class="name" [ngClass]="{'disabled': item.disabled}">{{item.name}}</span>
            
            
            <span class="strike" (click)="strike(item)">UnCheck</span>
            <span class="delete" (click)="remove(item)">Remove</span>

            <span class="count">{{item.count}}</span>

        </div>
    }
    </div>
}
